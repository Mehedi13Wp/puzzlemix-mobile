name: Verify PuzzleMix Source

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "pubspec.yaml"
      - "tools/**"
      - ".github/workflows/verify-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android compile shell
        run: |
          rm -rf /tmp/puzzlemix_shell
          flutter create /tmp/puzzlemix_shell \
            --platforms=android \
            --project-name=puzzlemix \
            --org=com.mehedi \
            --no-pub
          cp -R /tmp/puzzlemix_shell/android ./android
          python3 tools/configure_play_android.py --skip-signing

      - name: Check Play Store readiness
        run: python3 tools/check_play_readiness.py

      - name: Generate game sounds
        run: python3 tools/generate_sounds.py

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze

      - name: Build debug smoke APK
        run: flutter build apk --debug
