name: Release PuzzleMix v0.4

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v04.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform shell
        run: |
          rm -rf /tmp/puzzlemix_shell
          flutter create /tmp/puzzlemix_shell \
            --platforms=android \
            --project-name=puzzlemix_mobile \
            --org=com.mehedi.puzzlemix \
            --no-pub
          cp -R /tmp/puzzlemix_shell/android ./android
          sed -i 's/android:label="puzzlemix_mobile"/android:label="PuzzleMix"/' android/app/src/main/AndroidManifest.xml

      - name: Generate original game sounds
        run: python3 tools/generate_sounds.py

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk PuzzleMix-v0.4.apk

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.4 PuzzleMix-v0.4.apk \
            --title "PuzzleMix v0.4" \
            --notes "Version 0.4 adds an original premium sound pack: soft background music, tactile taps, liquid-pour audio, vial-complete chimes, arrow whooshes, Color Crew pops, friendly error cues, celebration audio, and an in-app sound on/off control. It keeps the realistic liquid and confetti effects from v0.3."
