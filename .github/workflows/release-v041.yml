name: Release PuzzleMix v0.4.1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v041.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform shell
        run: |
          rm -rf /tmp/puzzlemix_shell
          flutter create /tmp/puzzlemix_shell \
            --platforms=android \
            --project-name=puzzlemix_mobile \
            --org=com.mehedi.puzzlemix \
            --no-pub
          cp -R /tmp/puzzlemix_shell/android ./android
          sed -i 's/android:label="puzzlemix_mobile"/android:label="PuzzleMix"/' android/app/src/main/AndroidManifest.xml

      - name: Generate original game sounds
        run: python3 tools/generate_sounds.py

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk PuzzleMix-v0.4.1.apk

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.4.1 PuzzleMix-v0.4.1.apk \
            --title "PuzzleMix v0.4.1" \
            --notes "Sound hotfix: starts background audio after the app UI is ready, raises music/effect loudness, and regenerates the background loop at a clearly audible level. Includes the full original sound pack from v0.4."
