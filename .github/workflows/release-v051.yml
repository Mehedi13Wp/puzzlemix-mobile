name: Release PuzzleMix v0.5.1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v051.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform shell
        run: |
          rm -rf /tmp/puzzlemix_shell
          flutter create /tmp/puzzlemix_shell \
            --platforms=android \
            --project-name=puzzlemix_mobile \
            --org=com.mehedi.puzzlemix \
            --no-pub
          cp -R /tmp/puzzlemix_shell/android ./android
          sed -i 's/android:label="puzzlemix_mobile"/android:label="PuzzleMix"/' android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/puzzlemix_icon.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#176E3B" android:pathData="M0,0h108v108h-108z"/>
            <path android:fillColor="#F4FFF1" android:pathData="M27,18h54v12h-6v54c0,10 -8,18 -18,18h-6c-10,0 -18,-8 -18,-18v-54h-6z"/>
            <path android:fillColor="#FFB52E" android:pathData="M54,39a13,13 0,1 0,0.1,0z"/>
            <path android:fillColor="#F34E64" android:pathData="M43,62a10,10 0,1 0,0.1,0z"/>
            <path android:fillColor="#7CB342" android:pathData="M65,67a9,9 0,1 0,0.1,0z"/>
          </vector>
          EOF
          sed -i 's|android:icon="@mipmap/ic_launcher"|android:icon="@drawable/puzzlemix_icon"|' android/app/src/main/AndroidManifest.xml

      - name: Generate original game sounds
        run: python3 tools/generate_sounds.py

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk PuzzleMix-v0.5.1.apk

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.5.1 PuzzleMix-v0.5.1.apk \
            --title "PuzzleMix v0.5.1 — Deep Green Edition" \
            --notes "Visual hotfix for Fruit Sort Deluxe: gameplay levels now use a rich deep-green animated garden background, brighter leaf highlights, white high-contrast instructions, a matching dark-green app bar, and cleaner control contrast while keeping all v0.5 fruit, sound and celebration features."
