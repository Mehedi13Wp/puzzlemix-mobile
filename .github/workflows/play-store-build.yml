name: Build Play Store AAB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "PLAY_BUILD_TRIGGER.txt"

permissions:
  contents: read

jobs:
  play-store:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
      PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
      PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
      PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Play Store readiness
        run: python3 tools/check_play_readiness.py

      - name: Read release version
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          version = re.search(r'^version:\s*(\d+\.\d+\.\d+)\+(\d+)', Path('pubspec.yaml').read_text(), re.M)
          if not version:
              raise SystemExit('Invalid release version')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'RELEASE_VERSION={version.group(1)}\n')
              output.write(f'RELEASE_CODE={version.group(2)}\n')
          PY

      - name: Validate permanent signing secrets
        run: |
          test -n "$PLAY_UPLOAD_KEYSTORE_BASE64" || (echo "Missing PLAY_UPLOAD_KEYSTORE_BASE64" && exit 1)
          test -n "$PLAY_UPLOAD_STORE_PASSWORD" || (echo "Missing PLAY_UPLOAD_STORE_PASSWORD" && exit 1)
          test -n "$PLAY_UPLOAD_KEY_PASSWORD" || (echo "Missing PLAY_UPLOAD_KEY_PASSWORD" && exit 1)
          test -n "$PLAY_UPLOAD_KEY_ALIAS" || (echo "Missing PLAY_UPLOAD_KEY_ALIAS" && exit 1)

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Create Play Store Android shell
        run: |
          rm -rf /tmp/puzzlemix_shell
          flutter create /tmp/puzzlemix_shell \
            --platforms=android \
            --project-name=puzzlemix \
            --org=com.mehedi \
            --no-pub
          cp -R /tmp/puzzlemix_shell/android ./android
          python3 tools/configure_play_android.py

      - name: Restore permanent upload key
        run: |
          printf '%s' "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/app/puzzlemix-upload.jks
          cat > android/key.properties <<EOF
          storePassword=$PLAY_UPLOAD_STORE_PASSWORD
          keyPassword=$PLAY_UPLOAD_KEY_PASSWORD
          keyAlias=$PLAY_UPLOAD_KEY_ALIAS
          storeFile=puzzlemix-upload.jks
          EOF
          chmod 600 android/app/puzzlemix-upload.jks android/key.properties

      - name: Generate game sounds
        run: python3 tools/generate_sounds.py

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test fruit transfer and completion
        run: flutter test --no-pub

      - name: Build signed Play Store bundle
        run: flutter build appbundle --release

      - name: Verify AAB signature
        run: jarsigner -verify -verbose -certs build/app/outputs/bundle/release/app-release.aab

      - name: Also build signed APK for device testing
        run: flutter build apk --release

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Check 16 KB ZIP alignment
        run: |
          ZIPALIGN=$(find "$ANDROID_SDK_ROOT/build-tools" -name zipalign | sort -V | tail -1)
          "$ZIPALIGN" -c -P 16 -v 4 build/app/outputs/flutter-apk/app-release.apk

      - name: Package Play Store candidate
        run: |
          mkdir -p dist
          cp build/app/outputs/bundle/release/app-release.aab "dist/PuzzleMix-v${RELEASE_VERSION}-${RELEASE_CODE}-play.aab"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/PuzzleMix-v${RELEASE_VERSION}-${RELEASE_CODE}-signed.apk"
          cp branding/store/puzzlemix-play-icon-512.png dist/
          cp releases/0.6.10-17-notes.txt dist/
          sha256sum dist/* > dist/SHA256SUMS.txt

      - name: Upload Play Store candidate
        uses: actions/upload-artifact@v4
        with:
          name: PuzzleMix-Play-Store-v${{ env.RELEASE_VERSION }}-${{ env.RELEASE_CODE }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
