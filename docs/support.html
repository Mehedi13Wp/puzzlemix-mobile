<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PuzzleMix Support</title>
  <style>
    :root{color-scheme:dark}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(135deg,#031d11,#0b5b32);color:#e6f7ea;min-height:100vh}
    main{max-width:760px;margin:auto;padding:56px 20px}
    .card{background:rgba(6,53,30,.94);border:1px solid rgba(255,255,255,.1);border-radius:26px;padding:30px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
    h1{color:white;margin-top:0} a{color:#ffd15b} .muted{color:#a9d4b4}
  </style>
</head>
<body>
<main>
  <div class="card">
    <h1>PuzzleMix Support</h1>
    <p class="muted">Relax. Match. Enjoy.</p>
    <p>For gameplay problems, installation issues, privacy questions, or bug reports, open an issue in the public PuzzleMix support channel.</p>
    <p><a href="https://github.com/Mehedi13Wp/puzzlemix-mobile/issues">Open PuzzleMix Support</a></p>
    <p><a href="privacy.html">Privacy Policy</a></p>
  </div>
</main>
</body>
</html>
