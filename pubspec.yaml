name: puzzlemix_mobile
description: PuzzleMix is a polished casual puzzle game featuring Fruit Sort Deluxe, Arrow Escape, and Color Crew.
publish_to: "none"
version: 0.6.3+10

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
